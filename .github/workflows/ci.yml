name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=trida
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trida_test?schema=trida
      JWT_SECRET: integration-test-secret-not-for-production-32-characters
      VITE_API_BASE_URL: https://api.test.invalid/api/v2

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build backend and generate Prisma Client
        run: pnpm --dir backend build

      - name: Prepare disposable integration database
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE trida_test"
          psql "postgresql://postgres:postgres@localhost:5432/trida_test" -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Run backend contract tests
        run: pnpm --dir backend test

      - name: Run backend integration tests
        run: pnpm --dir backend test:integration

      - name: Lint backend
        run: pnpm --dir backend lint

      - name: Run frontend tests
        run: pnpm --dir frontend test

      - name: Type-check and lint frontend
        run: |
          pnpm --dir frontend type-check
          pnpm --dir frontend lint

      - name: Build frontend
        run: pnpm --dir frontend build
